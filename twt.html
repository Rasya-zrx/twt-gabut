<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>foto twt cihuyy</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-neutral-900 text-white pt-14">

  <!-- Checkbox penyimpan status menu (buka/tutup), harus sebelum elemen yang memakai peer -->
  <input type="checkbox" id="menu-toggle" class="peer sr-only">

  <!-- Navbar -->
  <nav class="fixed top-0 inset-x-0 z-30 h-14 bg-neutral-950 border-b border-neutral-700 flex items-center justify-between px-4">
    <a href="index.html" class="text-lg font-semibold">Raffenz</a>
    <label for="menu-toggle" class="cursor-pointer text-2xl px-2" aria-label="Buka menu">&#9776;</label>
  </nav>

  <!-- Overlay gelap: klik untuk menutup -->
  <label for="menu-toggle" class="fixed inset-0 z-40 bg-black/50 hidden peer-checked:block"></label>

  <!-- Menu samping -->
  <aside class="fixed top-0 right-0 z-50 h-full w-64 bg-neutral-950 p-4 translate-x-full peer-checked:translate-x-0 transition-transform duration-300">
    <div class="flex items-center justify-between mb-4">
      <h5 class="font-semibold">Menu</h5>
      <label for="menu-toggle" class="cursor-pointer text-2xl px-2" aria-label="Tutup menu">&#10005;</label>
    </div>
    <ul class="space-y-1">
        <li><a href="index.html" class="block px-3 py-2 rounded hover:bg-neutral-800">Home</a></li>
        <li><a href="aboutme.html" class="block px-3 py-2 rounded hover:bg-neutral-800">About Me</a></li>
        <li><a href="twt.html" class="block px-3 py-2 rounded bg-neutral-700 font-semibold">Foto TWT</a></li>
        <li><a href="prank.html" class="block px-3 py-2 rounded hover:bg-neutral-800">Foto Rasya Turu</a></li>
    </ul>
  </aside>

  <!-- Carousel: geser/swipe, atau klik tombol 1 / 2 -->
  <div class="flex overflow-x-auto snap-x snap-mandatory scroll-smooth [scrollbar-width:none]">
    <img id="slide1" src="images/twt1.jpeg" alt="twt di tw" class="w-full shrink-0 snap-center">
    <img id="slide2" src="images/twt2.jpeg" alt="twt photobooth" class="w-full shrink-0 snap-center">
  </div>
  <div class="flex justify-center gap-3 mt-3">
    <a href="#slide1" class="px-3 py-1 rounded bg-neutral-700 hover:bg-neutral-600">1</a>
    <a href="#slide2" class="px-3 py-1 rounded bg-neutral-700 hover:bg-neutral-600">2</a>
  </div>

  <section id="twt" class="max-w-3xl mx-auto px-4 py-6">
    <h2 class="text-2xl font-semibold text-center">TWT</h2>
    <p class="mt-2">
      Halo gaes, jadi twt tuh tim tim yang isinya orang orang yang asik dan menyenangan,
      ingfokan dolan maneh, tw yo oke... kan jenenge "TWT" hehe
    </p>
  </section>

</body>
</html>
